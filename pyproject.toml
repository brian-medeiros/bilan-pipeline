[build-system]
requires = ["setuptools>=69,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "bilan-pipeline"
version = "1.0.0"
description = "Local, evidence-grounded extraction of French annual accounts"
requires-python = ">=3.11"
dependencies = ["pymupdf==1.28.2", "jsonschema==4.26.0", "Pillow==12.3.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.7"]

[tool.setuptools]
packages = ["bilan_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
